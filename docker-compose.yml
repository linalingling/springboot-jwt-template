version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: my_postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: starter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: starter_db
      DB_USERNAME: my_postgres
      DB_PASSWORD: password123

volumes:
  postgres_data: